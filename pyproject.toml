[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "n-invariants"
version = "1.1.0"
description = "Sample sizes and sampling for distributions of metric n-point invariants"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

authors = [
  { name = "Michael Bleher", email = "mbleher@mathi.uni-heidelberg.de" },
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.scripts]
n-invariants = "n_invariants.cli:main"

[project.urls]
Repository = "https://github.com/subthaumic/n-invariants"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pre-commit>=3.5",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "manuscript/figures", "manuscript/substitution_models", "manuscript/sars_cov2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# `round` shadows a builtin, but it is the established keyword in these signatures;
# zip(..., strict=) is used where lengths are known to match.
ignore = ["A002", "B905", "E741"]

[tool.ruff.lint.per-file-ignores]
# The date-slice loop rebinds `prev`/`pvec` each iteration and `del`s them at the end to
# release memory; ruff reads the `del` as unbinding them for good (F821). The lambdas
# passed to `resolve` capture loop variables but are invoked within the same iteration
# (B023). Both are correct as written.
"manuscript/sars_cov2/step2_compute_invariants.py" = ["F821", "B023"]

[tool.pytest.ini_options]
# The package's tests. The article code in manuscript/ is a separate project with its own.
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
